name: AgentRouter Daily Check-in

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests pyyaml

      - name: Setup proxy (mihomo)
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
        run: |
          if [ -z "$SUB_URL" ]; then
            echo "未配置 SUB_URL，使用直连模式"
            echo "DIRECT_MODE=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "拉取订阅并生成 mihomo 配置..."
          python scripts/setup_proxy.py "$SUB_URL" mihomo_config.yaml

          echo "下载 mihomo..."
          MIMOMO_VER="v1.18.10"
          wget -q "https://github.com/MetaCubeX/mihomo/releases/download/${MIMOMO_VER}/mihomo-linux-amd64-${MIMOMO_VER}.gz"
          gunzip mihomo-linux-amd64-${MIMOMO_VER}.gz
          chmod +x mihomo-linux-amd64-${MIMOMO_VER}
          mv mihomo-linux-amd64-${MIMOMO_VER} mihomo

          echo "启动 mihomo..."
          nohup ./mihomo -f mihomo_config.yaml > mihomo.log 2>&1 &
          echo $! > mihomo.pid

          echo "等待代理就绪..."
          for i in {1..15}; do
            if curl -s --max-time 5 -x http://127.0.0.1:7890 https://www.google.com -o /dev/null; then
              echo "代理已就绪"
              echo "PROXY_URL=http://127.0.0.1:7890" >> $GITHUB_ENV
              exit 0
            fi
            sleep 2
          done

          echo "代理启动失败，查看日志："
          cat mihomo.log
          exit 1

      - name: Run check-in script
        env:
          GH_SESSION: ${{ secrets.GH_SESSION }}
          PROXY_URL: ${{ env.PROXY_URL }}
        run: python app.py

      - name: Cleanup proxy
        if: always()
        run: |
          if [ -f mihomo.pid ]; then
            kill $(cat mihomo.pid) 2>/dev/null || true
          fi

      - name: clear old run jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
