name: AgentRouter Daily Check-in

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests pyyaml

      - name: Setup proxy (mihomo)
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
        run: |
          if [ -z "$SUB_URL" ]; then
            echo "::warning::未配置 SUB_URL，使用直连模式（GitHub Actions 数据中心 IP 可能被 WAF 拦截）"
            exit 0
          fi

          echo "=== [1/5] 拉取订阅并生成 mihomo 配置 ==="
          python scripts/setup_proxy.py "$SUB_URL" mihomo_config.yaml
          echo "--- 配置文件前 50 行 ---"
          head -n 50 mihomo_config.yaml

          echo "=== [2/5] 下载 mihomo ==="
          MIMOMO_VER="v1.18.10"
          wget -q "https://github.com/MetaCubeX/mihomo/releases/download/${MIMOMO_VER}/mihomo-linux-amd64-${MIMOMO_VER}.gz"
          gunzip mihomo-linux-amd64-${MIMOMO_VER}.gz
          chmod +x mihomo-linux-amd64-${MIMOMO_VER}
          mv mihomo-linux-amd64-${MIMOMO_VER} mihomo
          echo "mihomo 版本:"
          ./mihomo -v

          echo "=== [3/5] 启动 mihomo ==="
          nohup ./mihomo -f mihomo_config.yaml > mihomo.log 2>&1 &
          echo $! > mihomo.pid
          sleep 2
          echo "--- mihomo 启动日志前 50 行 ---"
          head -n 50 mihomo.log

          echo "=== [4/5] 等待代理就绪 ==="
          READY=0
          for i in {1..20}; do
            echo "尝试 $i/20..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 -x http://127.0.0.1:7890 https://www.google.com || echo "000")
            echo "  Google 返回 HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ $READY -ne 1 ]; then
            echo "::error::代理启动失败"
            echo "--- 完整 mihomo 日志 ---"
            cat mihomo.log
            exit 1
          fi

          echo "=== [5/5] 代理诊断 ==="
          echo "--- 直连出口 IP ---"
          curl -s --max-time 10 https://api.ipify.org?format=json || echo "获取失败"
          echo ""
          echo "--- 代理出口 IP ---"
          curl -s --max-time 10 -x http://127.0.0.1:7890 https://api.ipify.org?format=json || echo "获取失败"
          echo ""
          echo "--- 测试 agentrouter.org 可达性（通过代理） ---"
          RESP_CODE=$(curl -s -o /tmp/agentrouter_test.html -w "%{http_code}" --max-time 15 -x http://127.0.0.1:7890 https://agentrouter.org/api/oauth/state?mode=login)
          echo "agentrouter /api/oauth/state 返回 HTTP $RESP_CODE"
          echo "--- 响应前 500 字符 ---"
          head -c 500 /tmp/agentrouter_test.html
          echo ""

          echo "PROXY_URL=http://127.0.0.1:7890" >> $GITHUB_ENV
          echo "::notice::代理已就绪"

      - name: Run check-in script
        env:
          GH_SESSION: ${{ secrets.GH_SESSION }}
          PROXY_URL: ${{ env.PROXY_URL }}
        run: python app.py

      - name: Cleanup proxy
        if: always()
        run: |
          if [ -f mihomo.pid ]; then
            kill $(cat mihomo.pid) 2>/dev/null || true
          fi

      - name: clear old run jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
